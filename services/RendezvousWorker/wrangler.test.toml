name = "opensteamer-rendezvous-test"
main = "src/index.js"
compatibility_date = "2026-07-13"

[vars]
AUDIO_SHARE_ENABLED = "true"
AUDIO_SHARE_DAILY_CREATION_LIMIT = "100"
AUDIO_SHARE_ACTIVE_GRANT_LIMIT = "32"
AUDIO_SHARE_TURN_CREDENTIAL_TTL_SECONDS = "600"
AUDIO_SHARE_TURN_FETCH_TIMEOUT_MS = "50"
INVITATION_TTL_SECONDS = "1"
TOMBSTONE_TTL_SECONDS = "1"
STUN_URLS = "stun:stun.cloudflare.com:3478"
TURN_CREDENTIAL_TTL_SECONDS = "600"
TURN_FETCH_TIMEOUT_MS = "50"

[[ratelimits]]
name = "JOIN_RATE_LIMITER"
namespace_id = "1001001"

  [ratelimits.simple]
  # Keep production's limiter behavior out of cross-test accounting. Individual rate-limit
  # behavior should use an isolated binding rather than making unrelated WebSocket scenarios
  # consume one shared test-process bucket.
  limit = 1000
  period = 60

[[durable_objects.bindings]]
name = "RENDEZVOUS"
class_name = "RendezvousSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RendezvousSession"]

[assets]
directory = "../../browser/beluga-audio/public"
binding = "AUDIO_SHARE_ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "AUDIO_SHARE"
class_name = "AudioShareSession"

[[migrations]]
tag = "v2-audio-share"
new_sqlite_classes = ["AudioShareSession"]

[[durable_objects.bindings]]
name = "AUDIO_SHARE_BUDGET"
class_name = "AudioShareBudget"

[[migrations]]
tag = "v3-audio-share-budget"
new_sqlite_classes = ["AudioShareBudget"]
