<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Beluga · Live audio</title>
  <link rel="stylesheet" href="/audio-share/style.css">
  <script type="module" src="/audio-share/listener.js"></script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">♫</div>
    <p class="eyebrow">BELUGA</p>
    <h1>Live from a Mac</h1>
    <p id="status" role="status">A private, listen-only audio stream.</p>
    <button id="listen" type="button">Listen live</button>
    <p id="time" aria-live="off"></p>
    <p class="note">No microphone, camera, or remote control. The link can be used by anyone it is forwarded to, until it expires or its owner ends it.</p>
    <audio id="audio" autoplay></audio>
  </main>
</body>
</html>
