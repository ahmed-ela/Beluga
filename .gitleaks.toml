[extend]
useDefault = true

[[allowlists]]
description = "Swift Crypto Curve25519 type declarations are code, not embedded key material"
regexTarget = "line"
paths = [
  '''shared/Sources/RemoteSessionCore/RemoteDeviceIdentity\.swift''',
  '''shared/Sources/RemoteSessionCore/RemotePairedDevice\.swift''',
]
regexes = [
  '''Curve25519\.(?:Signing|KeyAgreement)\.(?:PrivateKey|PublicKey)''',
]

[[allowlists]]
description = "Reviewed public Sparkle verification key, not a signing credential"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^macOS/BelugaHost/Release\.json$''']
regexes = ['''^\s*"publicEDKey": "1/xdC78VgHIKw\+HVPx6aAFWwv\+\+\+/ggtTlMm6QLOkQc="\s*$''']

[[allowlists]]
description = "Published Sparkle generate_keys executable checksum, not a key"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''^macOS/scripts/build-beluga-mac-client-contract\.rb$''']
regexes = ['''^\s*'generate_keys' => 'c37679f98d9121981cf7b2d18592fdc8b44931bffa604acf10c9e11791b6222e'\s*$''']

[[allowlists]]
description = "Two exact hello HMAC tags derived from fixed public Swift interoperability test inputs"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(?:^|/)shared/ProtocolFixtures/public-swift-engine-v1\.tsv$''']
regexes = [
  '''^dhGMiMfhGDhVNPfMDs4YCB4btCH1znz3hN4T2wvoygc=$''',
  '''^gvclDWLBaHw70D7nZ7uHK/icEwlCFfc8Pa\+UwRk2pSs=$''',
]

[[allowlists]]
description = "Same two public-input hello tags inside exact Swift bootstrap capture fixture"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''(?:^|/)shared/ProtocolFixtures/public-swift-bootstrap-envelopes-v1\.tsv$''']
regexes = [
  '''^dhGMiMfhGDhVNPfMDs4YCB4btCH1znz3hN4T2wvoygc=$''',
  '''^gvclDWLBaHw70D7nZ7uHK/icEwlCFfc8Pa\+UwRk2pSs=$''',
]
